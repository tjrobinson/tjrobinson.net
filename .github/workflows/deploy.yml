name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Lint and Typecheck
        run: npm run check
      - name: Lint content
        run: npm run lint:content
        continue-on-error: true
      - name: Fetch bookmarks
        env:
          BOOKMARKS_GITHUB_TOKEN: ${{ secrets.BOOKMARKS_GITHUB_TOKEN }}
          # Dependabot and fork PRs never receive repository secrets, so let those
          # builds continue without bookmarks. Pushes to main stay strict.
          BOOKMARKS_OPTIONAL: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: npm run fetch:bookmarks
      - name: Build Quartz
        run: npx quartz build -d content -o public/content
      - name: Copy root pages
        run: |
          mkdir -p public
          cp index.html public/
          cp CNAME public/
          cp robots.txt public/
          cp public/content/404.html public/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # download-artifact reads the site the build job produced
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Fetch bookmarks
        env:
          BOOKMARKS_GITHUB_TOKEN: ${{ secrets.BOOKMARKS_GITHUB_TOKEN }}
          BOOKMARKS_OPTIONAL: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: npm run fetch:bookmarks
      - name: Run unit tests
        run: npm test
      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: pages-artifact
      - name: Unpack built site
        # Test exactly what deploys, instead of spending another 7+ minutes
        # rebuilding the site inside Playwright's webServer timeout
        run: |
          mkdir -p public
          tar -xf pages-artifact/artifact.tar -C public
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # `secrets` is not available in a job-level `if:`, so surface "do we have
  # Cloudflare credentials?" as a boolean output that `if:` can read.
  preview-preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check for Cloudflare credentials
        id: check
        env:
          # Dependabot and fork PRs never receive repository secrets, and the
          # secrets are absent entirely until Cloudflare is set up, so treat a
          # missing value as "skip previews" rather than as a failure.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >>"$GITHUB_OUTPUT"
          else
            echo "configured=false" >>"$GITHUB_OUTPUT"
            echo "Cloudflare secrets not set; skipping preview deployment." >>"$GITHUB_STEP_SUMMARY"
          fi

  preview:
    needs: [build, preview-preflight]
    if: needs.preview-preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # download-artifact reads the site the build job produced
      actions: read
      # wrangler-action records the preview URL as a GitHub deployment on the PR
      deployments: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: pages-artifact
      - name: Unpack built site
        # Publish exactly the bytes the build job produced, rather than paying
        # for a second Quartz build.
        run: |
          mkdir -p public
          tar -xf pages-artifact/artifact.tar -C public
      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4.129.0"
          # `--branch=pr-N` can never match the project's production branch, so
          # this is always a preview deployment. www.tjrobinson.net keeps being
          # served by GitHub Pages from the `deploy` job.
          command: >-
            pages deploy public
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'tjrobinson-net' }}
            --branch=pr-${{ github.event.pull_request.number }}
            --commit-dirty=true
      - name: Summarise preview deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          echo "### Cloudflare Pages preview" >>"$GITHUB_STEP_SUMMARY"
          echo "" >>"$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ${DEPLOYMENT_URL:-unavailable}" >>"$GITHUB_STEP_SUMMARY"
          if [ -n "$ALIAS_URL" ]; then
            echo "- Branch alias: $ALIAS_URL" >>"$GITHUB_STEP_SUMMARY"
          fi
